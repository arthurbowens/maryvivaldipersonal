<section id="sobre" class="border-b border-zinc-800 bg-zinc-950 py-20 sm:py-24" aria-labelledby="about-heading">
  <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8">
    <div class="grid gap-14 lg:grid-cols-2 lg:items-center lg:gap-20">
      <div>
        <h2 id="about-heading" class="text-3xl font-semibold tracking-tight text-zinc-50 sm:text-4xl">
          {{ about.title }}
        </h2>
        @for (p of about.paragraphs; track $index) {
          <p class="mt-6 text-base leading-relaxed text-zinc-400">{{ p }}</p>
        }
      </div>
      <div class="space-y-6">
        <figure class="overflow-hidden rounded-2xl border border-zinc-800 bg-zinc-950 shadow-xl shadow-black/30">
          <img
            src="/foto2.jpeg"
            alt="Mary Vivaldi durante treino com aluna"
            class="max-h-[520px] w-full object-contain"
            loading="lazy"
          />
        </figure>
        <div class="grid gap-4 sm:grid-cols-3 lg:grid-cols-1 lg:gap-6">
          @for (st of about.stats; track st.label) {
            <div
              class="rounded-2xl border border-zinc-800 bg-zinc-900/50 p-6 text-center lg:text-left"
            >
              <p class="text-3xl font-semibold text-rose-400">{{ st.value }}</p>
              <p class="mt-1 text-sm text-zinc-400">{{ st.label }}</p>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</section>
