<footer class="border-t border-zinc-800 bg-black py-12 text-zinc-500">
  <div class="mx-auto flex max-w-6xl flex-col gap-8 px-4 sm:px-6 lg:flex-row lg:items-center lg:justify-between lg:px-8">
    <div>
      <p class="text-sm font-semibold text-zinc-200">{{ siteName }}</p>
      <p class="mt-2 max-w-md text-sm">{{ footer.tagline }}</p>
      <p class="mt-4 text-xs">
        © {{ year }} {{ siteName }}. {{ footer.rights }}
      </p>
    </div>
    <nav class="flex flex-wrap gap-4" aria-label="Contato e redes sociais">
      <a
        class="text-sm font-medium text-zinc-400 transition hover:text-rose-400"
        [href]="whatsappHref"
        target="_blank"
        rel="noopener noreferrer"
        >WhatsApp {{ whatsappDisplay }}</a
      >
      @for (s of social; track s.label) {
        <a
          class="text-sm font-medium text-zinc-400 transition hover:text-rose-400"
          [href]="s.href"
          target="_blank"
          rel="noopener noreferrer"
          >{{ s.label }}</a
        >
      }
    </nav>
  </div>
</footer>
