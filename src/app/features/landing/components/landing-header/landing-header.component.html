<header
  class="sticky top-0 z-50 border-b border-zinc-800/80 bg-zinc-950/85 backdrop-blur-md"
>
  <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-4 sm:px-6 lg:px-8">
    <a
      href="#inicio"
      class="group rounded-md focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-rose-500/50 focus-visible:ring-offset-2 focus-visible:ring-offset-zinc-950"
      (click)="closeMenu()"
      aria-label="{{ logoLine }} — início"
    >
      <span
        class="block text-lg font-semibold tracking-tight text-zinc-100 transition-colors group-hover:text-zinc-50 sm:text-xl"
      >
        {{ brandFirst }}
        @if (brandRest) {
          <span
            class="ml-1.5 bg-gradient-to-r from-rose-400 to-rose-300 bg-clip-text font-medium text-transparent group-hover:from-rose-300 group-hover:to-rose-200"
            >{{ brandRest }}</span
          >
        }
      </span>
    </a>

    <nav class="hidden items-center gap-8 md:flex" aria-label="Principal">
      @for (item of navItems; track item.fragment) {
        <a
          class="text-sm font-medium text-zinc-400 transition-colors hover:text-rose-400"
          [href]="'#' + item.fragment"
          >{{ item.label }}</a
        >
      }
    </nav>

    <div class="flex items-center gap-3">
      <a
        class="hidden rounded-full bg-rose-500 px-4 py-2 text-sm font-semibold text-zinc-950 shadow-md shadow-rose-900/40 transition hover:bg-rose-400 md:inline-flex"
        href="#contato"
        >Agendar</a
      >
      <button
        type="button"
        class="inline-flex h-10 w-10 items-center justify-center rounded-lg border border-zinc-700 text-zinc-200 md:hidden"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-nav"
        aria-label="Abrir menu"
      >
        @if (menuOpen()) {
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path stroke-width="2" stroke-linecap="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        } @else {
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path stroke-width="2" stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        }
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <div
      id="mobile-nav"
      class="border-t border-zinc-800 bg-zinc-950 px-4 py-4 md:hidden"
    >
      <nav class="flex flex-col gap-3" aria-label="Mobile">
        @for (item of navItems; track item.fragment) {
          <a
            class="rounded-lg px-3 py-2 text-sm font-medium text-zinc-300 hover:bg-zinc-900 hover:text-rose-300"
            [href]="'#' + item.fragment"
            (click)="closeMenu()"
            >{{ item.label }}</a
          >
        }
        <a
          class="mt-2 rounded-full bg-rose-500 px-4 py-3 text-center text-sm font-semibold text-zinc-950"
          href="#contato"
          (click)="closeMenu()"
          >Agendar conversa</a
        >
      </nav>
    </div>
  }
</header>
