<section id="servicos" class="border-b border-zinc-800 bg-zinc-900/40 py-20 sm:py-24" aria-labelledby="services-heading">
  <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8">
    <div class="max-w-2xl">
      <h2 id="services-heading" class="text-3xl font-semibold tracking-tight text-zinc-50 sm:text-4xl">
        {{ intro.title }}
      </h2>
      <p class="mt-4 text-lg text-zinc-400">{{ intro.subtitle }}</p>
    </div>

    <ul class="mt-14 grid gap-6 sm:grid-cols-2 lg:gap-8">
      @for (s of services; track s.title) {
        <li
          class="group rounded-2xl border border-zinc-800 bg-zinc-950/60 p-8 transition hover:border-rose-500/40 hover:shadow-lg hover:shadow-rose-950/20"
        >
          <div
            class="mb-6 inline-flex h-12 w-12 items-center justify-center rounded-xl bg-zinc-900 text-rose-400 ring-1 ring-zinc-800 group-hover:bg-rose-500/10 group-hover:ring-rose-500/30"
            aria-hidden="true"
          >
            @switch (s.icon) {
              @case ('target') {
                <!-- dumbbell -->
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14.4 14.4 9.6 9.6" />
                  <path d="M18.657 21.485a2 2 0 1 1-2.829-2.828l-1.767 1.768a2 2 0 1 1-2.829-2.829l6.364-6.364a2 2 0 1 1 2.829 2.829l-1.768 1.767a2 2 0 1 1 2.828 2.829z" />
                  <path d="m21.5 21.5-1.4-1.4" />
                  <path d="M3.9 3.9 2.5 2.5" />
                  <path d="M6.404 12.768a2 2 0 1 1-2.829-2.829l1.768-1.767a2 2 0 1 1-2.828-2.829l2.828-2.828a2 2 0 1 1 2.829 2.828l1.767-1.768a2 2 0 1 1 2.829 2.829z" />
                </svg>
              }
              @case ('clock') {
                <!-- smartphone -->
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="14" height="20" x="5" y="2" rx="2" ry="2" />
                  <path d="M12 18h.01" />
                </svg>
              }
              @case ('chart') {
                <!-- clipboard-list -->
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="8" height="4" x="8" y="2" rx="1" ry="1" />
                  <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
                  <path d="M12 11h4" />
                  <path d="M12 16h4" />
                  <path d="M8 11h.01" />
                  <path d="M8 16h.01" />
                </svg>
              }
              @case ('heart') {
                <!-- heart-pulse -->
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
                  <path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27" />
                </svg>
              }
            }
          </div>
          <h3 class="text-xl font-semibold text-zinc-100">{{ s.title }}</h3>
          <p class="mt-3 text-sm leading-relaxed text-zinc-400">{{ s.description }}</p>
        </li>
      }
    </ul>
  </div>
</section>
