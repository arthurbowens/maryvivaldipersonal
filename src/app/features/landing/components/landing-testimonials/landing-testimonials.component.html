<section
  id="depoimentos"
  class="border-b border-zinc-800 bg-zinc-900/30 py-20 sm:py-24"
  aria-labelledby="testimonials-heading"
>
  <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8">
    <div class="max-w-2xl">
      <h2 id="testimonials-heading" class="text-3xl font-semibold tracking-tight text-zinc-50 sm:text-4xl">
        {{ intro.title }}
      </h2>
      <p class="mt-4 text-lg text-zinc-400">{{ intro.subtitle }}</p>
    </div>

    <figure class="mt-12 overflow-hidden rounded-2xl border border-zinc-800 bg-zinc-950 shadow-xl shadow-black/30">
      <img
        src="/foto3.jpeg"
        alt="Evolução de resultados de treino"
        class="max-h-[560px] w-full object-contain"
        loading="lazy"
      />
    </figure>

    <p class="mt-8 text-sm text-zinc-500">
      Resultados reais com acompanhamento estratégico, consistência e evolução progressiva.
    </p>
  </div>
</section>
