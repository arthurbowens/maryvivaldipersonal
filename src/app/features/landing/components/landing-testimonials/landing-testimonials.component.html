<section
  id="depoimentos"
  class="border-b border-zinc-800 bg-zinc-900/30 py-20 sm:py-24"
  aria-labelledby="testimonials-heading"
>
  <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8">
    <div class="max-w-2xl">
      <h2 id="testimonials-heading" class="text-3xl font-semibold tracking-tight text-zinc-50 sm:text-4xl">
        {{ intro.title }}
      </h2>
      <p class="mt-4 text-lg text-zinc-400">{{ intro.subtitle }}</p>
    </div>

    <div
      class="relative mt-12"
      role="region"
      aria-roledescription="carrossel"
      aria-label="Resultados de alunos"
      (keydown.arrowleft)="prev()"
      (keydown.arrowright)="next()"
    >
      <div
        class="overflow-hidden rounded-2xl border border-zinc-800 bg-zinc-950 shadow-xl shadow-black/30"
        (touchstart)="onTouchStart($event)"
        (touchend)="onTouchEnd($event)"
      >
        <div
          class="flex transition-transform duration-500 ease-out"
          [style.transform]="'translateX(-' + current() * 100 + '%)'"
        >
          @for (item of results; track item.src; let i = $index) {
            <figure
              class="flex w-full shrink-0 items-center justify-center"
              role="group"
              aria-roledescription="slide"
              [attr.aria-label]="i + 1 + ' de ' + results.length"
              [attr.aria-hidden]="i !== current()"
            >
              <img
                [src]="item.src"
                [alt]="item.alt"
                class="h-[460px] w-full object-contain sm:h-[560px]"
                loading="lazy"
              />
            </figure>
          }
        </div>
      </div>

      <button
        type="button"
        class="absolute left-3 top-1/2 inline-flex h-11 w-11 -translate-y-1/2 items-center justify-center rounded-full border border-zinc-700 bg-zinc-950/80 text-zinc-100 backdrop-blur transition hover:border-rose-400/60 hover:text-rose-300"
        aria-label="Resultado anterior"
        (click)="prev()"
      >
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
      </button>
      <button
        type="button"
        class="absolute right-3 top-1/2 inline-flex h-11 w-11 -translate-y-1/2 items-center justify-center rounded-full border border-zinc-700 bg-zinc-950/80 text-zinc-100 backdrop-blur transition hover:border-rose-400/60 hover:text-rose-300"
        aria-label="Próximo resultado"
        (click)="next()"
      >
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
        </svg>
      </button>

      <div class="mt-6 flex justify-center gap-2">
        @for (item of results; track item.src; let i = $index) {
          <button
            type="button"
            class="h-2.5 rounded-full transition-all"
            [class.w-8]="i === current()"
            [class.bg-rose-400]="i === current()"
            [class.w-2.5]="i !== current()"
            [class.bg-zinc-700]="i !== current()"
            [attr.aria-label]="'Ir para resultado ' + (i + 1)"
            [attr.aria-current]="i === current()"
            (click)="goTo(i)"
          ></button>
        }
      </div>
    </div>

    <p class="mt-8 text-sm text-zinc-500">
      Resultados reais com acompanhamento estratégico, consistência e evolução progressiva.
    </p>
  </div>
</section>
